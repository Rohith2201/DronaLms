version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: drona_lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  ai-service:
    build:
      context: ./ai-service
    env_file:
      - ./ai-service/.env.example
    ports:
      - "8000:8000"

volumes:
  postgres_data:
